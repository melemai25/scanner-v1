# ── Setups ──────────────────────────────────────────────────
# A setup fires when ALL of its conditions are true on the latest
# completed candle. Each condition is:   <left> <operator> <right>
#
# Operators:  <  >  <=  >=  crosses_above  crosses_below
#
# Values you can use on either side:
#   close  open  high  low  volume
#   rsi            (14-period)      rsi_2, rsi_4 ... any length
#   macd  macd_signal  macd_hist    (12/26/9)
#   sma_50  ema_20 ...              any length
#   avg_volume_20 ...               average volume, any length
#   ibs                             where the close sits in the day's range (0 = at the low, 100 = at the high)
#   lowest_close_7  highest_close_7 lowest/highest close of the last N days (incl. today)
#   a number (30, 70, 0), or a multiple like 2*avg_volume_20
#
# EXITS are listed in each setup's comment. The scanner alerts on
# entries; check your exit rule each day you hold a position.

setups:
  # 1) Connors RSI(2) pullback — the best-documented high-win-rate setup.
  #    SPY 1993–2026: ~77% winners, avg +0.63%/trade (74% since 2009).
  #    EXIT: when close goes above sma_5.
  - name: RSI(2) pullback in uptrend
    when:
      - close > sma_200
      - rsi_2 < 10

  # 2) Same setup, but the close is also near the day's low.
  #    Fewer signals; IBS < 25 raised avg profit ~21% in Alvarez's test.
  #    EXIT: when close goes above sma_5.
  - name: RSI(2) pullback + weak close (A+)
    when:
      - close > sma_200
      - rsi_2 < 10
      - ibs < 25

  # 3) Connors RSI 25 — 20 ETFs, 2009–2012 walk-forward: 74.7% winners, avg +0.92%.
  #    EXIT: when rsi_4 goes above 55.
  - name: RSI(4) below 25 in uptrend
    when:
      - close > sma_200
      - rsi_4 < 25

  # 4) Double 7s — simpler, weaker evidence than #1 (lagged buy & hold after 2008).
  #    EXIT: when close is a 7-day high (close >= highest_close_7).
  - name: Double 7s (7-day low in uptrend)
    when:
      - close > sma_200
      - close <= lowest_close_7

  # 5) Trend-following, not mean reversion: lower win rate (~50%) but bigger winners.
  #    MACD crossing up while above zero = momentum resuming in an uptrend.
  #    EXIT: MACD crosses back below its signal line, or your own stop.
  - name: MACD bullish cross above zero
    when:
      - close > sma_200
      - macd crosses_above macd_signal
      - macd > 0

  # Bear cases
    # Bearish mirror of #1: a short bounce inside a downtrend.
  # Short-side win rates ran ~65-68% in Connors' ETF tests (lower than longs).
  # EXIT (cover): when close goes below sma_5.
  - name: "BEARISH: RSI(2) bounce in downtrend"
    when:
      - close < sma_200
      - rsi_2 > 90

  # Bearish mirror of #2: the bounce also closes near the day's high.
  - name: "BEARISH: RSI(2) bounce + strong close (A+)"
    when:
      - close < sma_200
      - rsi_2 > 90
      - ibs > 75

  # Bearish mirror of #5: momentum rolling over inside a downtrend.
  # Bearish mirror of #1: a short bounce inside a downtrend.
  # Short-side win rates ran ~65-68% in Connors' ETF tests (lower than longs).
  # EXIT (cover): when close goes below sma_5.
  - name: "BEARISH: RSI(2) bounce in downtrend"
    when:
      - close < sma_200
      - rsi_2 > 90

  # Bearish mirror of #2: the bounce also closes near the day's high.
  - name: "BEARISH: RSI(2) bounce + strong close (A+)"
    when:
      - close < sma_200
      - rsi_2 > 90
      - ibs > 75

  # Bearish mirror of #5: momentum rolling over inside a downtrend.
  - name: "BEARISH: MACD cross below zero"
    when:
      - close < sma_200
      - macd crosses_below macd_signal
      - macd < 0

  - name: "WARNING: overbought"
    when:
      - rsi_2 > 95
      - ibs > 80

# Send an email even when nothing triggered (handy to confirm it's running).
email_when_empty: false


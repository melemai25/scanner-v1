name: Setup Scanner

on:
  schedule:
    - cron: "0 22 * * 1-5"    # After close: 22:00 UTC = 12:00 noon Hawaii
    - cron: "30 12 * * 1-5"   # Pre-market: 8:30 AM New York during daylight time (Mar–Nov)
    - cron: "30 13 * * 1-5"   # Pre-market: 8:30 AM New York during standard time (Nov–Mar)
  workflow_dispatch: {}       # "Run workflow" button for manual runs

jobs:
  scan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: setup-scanner
    steps:
      - uses: actions/checkout@v5

      # Only one of the two pre-market times is 8:30 AM in New York on a given day;
      # this skips the other one, and labels each email.
      - name: Pick scan type
        id: gate
        run: |
          offset=$(TZ=America/New_York date +%z)
          case "${{ github.event.schedule }}" in
            "30 12 * * 1-5") [ "$offset" = "-0400" ] && label="Pre-market" || label=skip ;;
            "30 13 * * 1-5") [ "$offset" = "-0500" ] && label="Pre-market" || label=skip ;;
            "0 22 * * 1-5")  label="After close" ;;
            *)               label="Manual" ;;
          esac
          echo "Scan type: $label"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.label != 'skip'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup-scanner/requirements.txt
      - if: steps.gate.outputs.label != 'skip'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.label != 'skip'
        run: python scanner.py
        env:
          SCAN_LABEL: ${{ steps.gate.outputs.label }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

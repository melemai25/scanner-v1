name: Setup Scanner

on:
  schedule:
    # Times are UTC. 22:00 UTC Mon–Fri = after the US close year-round
    # (that's 12:00 noon in Hawaii).
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: setup-scanner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup-scanner/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scanner.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
